<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="glowGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Radial ambient glows -->
    <radialGradient id="ambientCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambientPurple" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for Glow -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes flow-line {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulse-node {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes float-badge {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes float-badge-rev {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(7px); }
      }
      @keyframes glow-shift {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }

      .animated-flow {
        stroke-dasharray: 8 6;
        animation: flow-line 20s linear infinite;
      }
      .animated-flow-fast {
        stroke-dasharray: 6 6;
        animation: flow-line 12s linear infinite reverse;
      }
      .node-pulse {
        animation: pulse-node 4s ease-in-out infinite;
        transform-origin: center;
      }
      .float-item-1 {
        animation: float-badge 6s ease-in-out infinite;
      }
      .float-item-2 {
        animation: float-badge-rev 7s ease-in-out infinite;
      }
      .float-item-3 {
        animation: float-badge 8s ease-in-out 1s infinite;
      }
      .float-item-4 {
        animation: float-badge-rev 6.5s ease-in-out 1.5s infinite;
      }
      .ambient-pulse {
        animation: glow-shift 5s ease-in-out infinite alternate;
      }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 11px;
        fill: #cbd5e1;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 1.2px;
      }
    </style>
  </defs>

  <!-- Deep Background Layer -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGradient)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="240" cy="120" r="280" fill="url(#ambientCyan)" class="ambient-pulse" />
  <circle cx="980" cy="260" r="300" fill="url(#ambientPurple)" class="ambient-pulse" />

  <!-- Subtle Architecture Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.35">
    <line x1="100" y1="0" x2="100" y2="380" />
    <line x1="250" y1="0" x2="250" y2="380" />
    <line x1="400" y1="0" x2="400" y2="380" />
    <line x1="550" y1="0" x2="550" y2="380" />
    <line x1="700" y1="0" x2="700" y2="380" />
    <line x1="850" y1="0" x2="850" y2="380" />
    <line x1="1000" y1="0" x2="1000" y2="380" />
    <line x1="1150" y1="0" x2="1150" y2="380" />

    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- DYNAMIC / ANIMATED BACKGROUND ARCHITECTURE FLOWS (Layered behind foreground) -->
  <g fill="none" opacity="0.6">
    <!-- Top left circuit connection -->
    <path d="M 50,110 L 180,110 L 230,60 L 360,60" stroke="#38bdf8" stroke-width="1.6" class="animated-flow" />
    <circle cx="180" cy="110" r="3.5" fill="#38bdf8" class="node-pulse" />
    <circle cx="230" cy="60" r="3.5" fill="#38bdf8" />

    <!-- Bottom left circuit connection -->
    <path d="M 70,280 L 190,280 L 250,330 L 420,330" stroke="#818cf8" stroke-width="1.6" class="animated-flow-fast" />
    <circle cx="190" cy="280" r="3.5" fill="#818cf8" />
    <circle cx="250" cy="330" r="3.5" fill="#818cf8" class="node-pulse" />

    <!-- Top right circuit connection -->
    <path d="M 820,50 L 960,50 L 1020,100 L 1140,100" stroke="#c084fc" stroke-width="1.6" class="animated-flow" />
    <circle cx="960" cy="50" r="3.5" fill="#c084fc" class="node-pulse" />
    <circle cx="1020" cy="100" r="3.5" fill="#c084fc" />

    <!-- Bottom right circuit connection -->
    <path d="M 780,320 L 910,320 L 980,260 L 1130,260" stroke="#38bdf8" stroke-width="1.6" class="animated-flow-fast" />
    <circle cx="910" cy="320" r="3.5" fill="#38bdf8" />
    <circle cx="980" cy="260" r="3.5" fill="#38bdf8" class="node-pulse" />
  </g>

  <!-- FLOATING PILL CARDS (Placed strategically at peripheries to never overlap title) -->
  <!-- Top Left Pill -->
  <g class="float-item-1" filter="url(#cardShadow)">
    <rect x="52" y="38" width="190" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="68" cy="55" r="4.5" fill="#38bdf8" />
    <text x="82" y="59" class="badge-text">☁️ Multi-Cloud Orchestration</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="float-item-2" filter="url(#cardShadow)">
    <rect x="52" y="306" width="195" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="68" cy="323" r="4.5" fill="#4ade80" />
    <text x="82" y="327" class="badge-text">⚙️ Infrastructure-as-Code</text>
  </g>

  <!-- Top Right Pill -->
  <g class="float-item-3" filter="url(#cardShadow)">
    <rect x="955" y="38" width="195" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="972" cy="55" r="4.5" fill="#a855f7" />
    <text x="986" y="59" class="badge-text">🛡️ Policy &amp; Governance</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="float-item-4" filter="url(#cardShadow)">
    <rect x="965" y="306" width="185" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="982" cy="323" r="4.5" fill="#f59e0b" />
    <text x="996" y="327" class="badge-text">💰 FinOps &amp; Cost Control</text>
  </g>

  <!-- Central Highlight Border / Gradient Frame for Title Focus -->
  <rect x="250" y="30" width="700" height="320" rx="20" fill="#0b1120" fill-opacity="0.65" stroke="url(#primaryGrad)" stroke-width="1" stroke-opacity="0.3" filter="url(#cardShadow)" />

  <!-- FOREGROUND: TITLE, SUBTITLE & METRICS (HIGH CONTRAST & CLEAR) -->
  <g text-anchor="middle">
    <!-- Category Pill Tag -->
    <g transform="translate(600, 72)">
      <rect x="-175" y="-14" width="350" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <text x="0" y="4" class="pill-text" fill="#a5b4fc">⚡ CURATED ENTERPRISE ECOSYSTEM ⚡</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="142" class="title-text" font-size="34">
      Awesome Enterprise Cloud
    </text>
    <text x="600" y="185" class="title-text" font-size="34" fill="url(#primaryGrad)">
      Infrastructure Management
    </text>

    <!-- Subtitle -->
    <text x="600" y="228" class="subtitle-text" font-size="15">
      The definitive directory of enterprise SaaS solutions and open-source GitHub projects
    </text>
    <text x="600" y="250" class="subtitle-text" font-size="13" fill="#64748b">
      Infrastructure-as-Code • Multi-Cloud Control Planes • Policy as Code • FinOps • GitOps
    </text>

    <!-- Feature Pillars Bar -->
    <g transform="translate(600, 292)">
      <!-- Pill 1: Enterprise SaaS -->
      <g transform="translate(-235, 0)">
        <rect x="-65" y="-13" width="130" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" />
        <text x="0" y="4" class="badge-text" font-size="11" fill="#38bdf8">🏢 Enterprise SaaS</text>
      </g>
      <!-- Pill 2: Open Source -->
      <g transform="translate(-80, 0)">
        <rect x="-68" y="-13" width="136" height="26" rx="13" fill="#1e293b" stroke="#818cf8" stroke-width="0.8" />
        <text x="0" y="4" class="badge-text" font-size="11" fill="#818cf8">⚡ Open-Source IaC</text>
      </g>
      <!-- Pill 3: Governance -->
      <g transform="translate(80, 0)">
        <rect x="-70" y="-13" width="140" height="26" rx="13" fill="#1e293b" stroke="#c084fc" stroke-width="0.8" />
        <text x="0" y="4" class="badge-text" font-size="11" fill="#c084fc">🔒 Policy &amp; Security</text>
      </g>
      <!-- Pill 4: FinOps -->
      <g transform="translate(235, 0)">
        <rect x="-65" y="-13" width="130" height="26" rx="13" fill="#1e293b" stroke="#34d399" stroke-width="0.8" />
        <text x="0" y="4" class="badge-text" font-size="11" fill="#34d399">📊 FinOps &amp; Drift</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Shimmer Line -->
  <rect x="0" y="377" width="1200" height="3" fill="url(#primaryGrad)" />
</svg>
